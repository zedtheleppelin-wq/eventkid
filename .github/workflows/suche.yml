name: Termine suchen

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  suche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Termine suchen
        run: python suche.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Ergebnis speichern
        run: |
          git config user.name "kinderkalender-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.json geocache.json
          git diff --cached --quiet || (git commit -m "Termine aktualisiert $(date +%F)" && git push)
